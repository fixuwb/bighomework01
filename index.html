<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic Route · 12 countries</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #fafafa;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      color: #1e1e1e;
      line-height: 1.5;
      padding: 1.5rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container { max-width: 1200px; margin: 0 auto; width: 100%; }

    .header {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #ccc; padding-bottom: 1rem; margin-bottom: 1.5rem;
    }
    .project-title { font-weight: 400; font-size: 1.3rem; letter-spacing: 0.02em; color: #2c2c2c; }
    .stats { display: flex; flex-wrap: wrap; align-items: center; gap: 1.8rem; font-size: 0.95rem; color: #3a3a3a; }
    .stats span {
      background: #f0f0f0; padding: 0.2rem 0.7rem; border-radius: 20px; border: 1px solid #d0d0d0;
    }
    .reset-btn {
      background: none; border: 1px solid #aaa; padding: 0.3rem 1rem; font-size: 0.9rem;
      color: #1e1e1e; border-radius: 20px; cursor: pointer; transition: all 0.15s;
    }
    .reset-btn:hover { background: #e8e8e8; border-color: #777; }

    .map-wrapper {
      position: relative;
      background: #ffffff;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 0;
      margin-bottom: 1.8rem;
      overflow: hidden;
    }

    .map-image {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      pointer-events: none;
    }

    .map-dot {
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #b8b8b8;
      border: 1px solid #5e5e5e;
      transform: translate(-50%, -50%);
      transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
      cursor: default;
      z-index: 2;
    }

    .map-dot.visited {
      background: #c94a4a;
      border-color: #7a1a1a;
      box-shadow: 0 0 0 2px rgba(201, 74, 74, 0.35);
    }

    .map-dot.available {
      background: #2d6e2d;
      border-color: #144514;
      box-shadow: 0 0 0 3px rgba(45, 110, 45, 0.35);
    }

    .cards-section { margin: 1.5rem 0 2rem; }
    .cards-title {
      font-weight: 400; font-size: 1.1rem; margin-bottom: 1rem; color: #444;
      border-left: 3px solid #999; padding-left: 0.8rem;
    }
    .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2rem; }
    @media (max-width: 700px) { .cards-grid { grid-template-columns: 1fr; } }

    .country-card {
      background: #ffffff; border: 1px solid #ccc; border-radius: 4px; padding: 1.2rem 0.8rem;
      text-align: center; cursor: pointer; transition: background 0.15s, border-color 0.15s;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }
    .country-card:hover { background: #f5f5f5; border-color: #999; }
    .country-card h3 {
      font-weight: 500; font-size: 1.1rem; letter-spacing: 0.01em; margin-bottom: 0.5rem; color: #222;
    }
    .country-card .topic-badge {
      font-size: 0.75rem; text-transform: uppercase; color: #555; border: 1px solid #ddd;
      display: inline-block; padding: 0.15rem 0.6rem; border-radius: 12px; background: #fafafa;
    }
    .country-card.visited-marker { border-left: 4px solid #c94a4a; }

    .dialog-panel {
      background: #ffffff; border: 1px solid #ccc; border-radius: 4px;
      padding: 1.8rem 1.8rem 2rem; margin: 1.5rem 0 1rem;
    }
    .country-header {
      display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; margin-bottom: 1.2rem;
    }
    .country-header h2 { font-weight: 400; font-size: 1.6rem; }
    .topic-tag {
      font-size: 0.85rem; color: #666; border: 1px solid #ddd; padding: 0.2rem 0.8rem; border-radius: 20px;
    }

    .name-input-row {
      display: flex; align-items: center; gap: 1rem; margin-bottom: 1.2rem; flex-wrap: wrap;
    }
    .name-input-row label { font-size: 0.95rem; color: #555; }
    .name-input-row input {
      padding: 0.4rem 0.8rem; border: 1px solid #bbb; border-radius: 30px;
      font-size: 0.95rem; font-family: inherit; background: #fff; width: 200px;
    }

    .dialogue-box {
      background: #f9f9f9; border: 1px solid #e0e0e0; padding: 1.2rem 1.2rem 1rem; border-radius: 4px;
      display: flex; flex-direction: column; min-height: 250px;
    }

    .dialogue-scroll {
      flex: 1; overflow-y: auto; max-height: 500px; margin-bottom: 1rem;
      padding-right: 0.5rem;
    }

    .dialogue-line {
      margin-bottom: 0.9rem;
      padding: 0.6rem 1rem;
      border-radius: 16px;
      max-width: 80%;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .dialogue-line.character {
      background: #eef3ee;
      border: 1px solid #d0dbd0;
      margin-left: auto;
      text-align: right;
    }
    .dialogue-line.friend {
      background: #ffffff;
      border: 1px solid #e0e0e0;
      margin-right: auto;
    }
    .dialogue-line.guide {
      background: #f0f4fa;
      border: 1px solid #d0dce8;
      margin-right: auto;
    }
    .dialogue-line .speaker {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: #6b6b6b;
      margin-bottom: 0.15rem;
    }
    .dialogue-line.character .speaker { text-align: right; }

    .dialogue-controls {
      border-top: 1px dashed #ddd;
      padding-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    .options-list { display: flex; flex-direction: column; gap: 0.6rem; }

    .option-btn {
      background: #ffffff; border: 1px solid #bbb; border-radius: 30px; padding: 0.7rem 1.2rem;
      text-align: left; font-size: 0.95rem; cursor: pointer; transition: background 0.1s, border-color 0.1s; color: #1e1e1e;
    }
    .option-btn:hover { background: #f0f0f0; border-color: #888; }
    .option-btn.correct { background: #e0f0e0; border-color: #2d6e2d; color: #1a4a1a; }
    .option-btn.incorrect { background: #fae8e8; border-color: #b34a4a; color: #6b2a2a; }
    .option-btn:disabled { opacity: 0.9; cursor: default; }

    .continue-btn {
      align-self: flex-start;
      background: #ffffff; border: 1px solid #333; color: #1e1e1e;
      padding: 0.5rem 1.5rem; font-size: 0.9rem; border-radius: 30px; cursor: pointer;
      transition: background 0.15s;
    }
    .continue-btn:hover { background: #eaeaea; }

    .feedback {
      margin-top: 0.5rem; font-size: 0.85rem; color: #4d4d4d;
    }
    .feedback.correct-feedback { color: #1e5e1e; }
    .feedback.wrong-feedback { color: #a03030; }

    .next-btn {
      margin-top: 1.2rem; background: #ffffff; border: 1px solid #333; color: #1e1e1e;
      padding: 0.6rem 1.8rem; font-size: 0.95rem; border-radius: 30px; cursor: pointer;
      transition: background 0.15s; display: inline-block;
    }
    .next-btn:hover { background: #eaeaea; }

    .hidden { display: none; }
    .no-options-message { font-size: 0.95rem; color: #555; margin: 1rem 0; }
    .footer-note {
      text-align: center; font-size: 0.8rem; color: #888;
      border-top: 1px solid #e0e0e0; padding-top: 1rem; margin-top: 1.5rem;
    }
  </style>
</head>

  let visitedCountries = new Set();
  let dialoguesCompleted = 0;

  let currentCountry = null;

    countryId: null,
    step: 0,
    playerName: '',
    lines: [],

  };

  const visitedCounterEl = document.getElementById('visitedCounter');
  const dialogCounterEl = document.getElementById('dialogCounter');
  const resetBtn = document.getElementById('resetBtn');

  function updateCounters() {
    visitedCounterEl.textContent = `Visited: ${visitedCountries.size} / 12`;
    dialogCounterEl.textContent = `Dialogues: ${dialoguesCompleted}`;
  }

  function updateMap() {
    document.querySelectorAll('.map-dot').forEach(dot => {
      dot.classList.remove('visited', 'available');
    });
    visitedCountries.forEach(id => {
      const dot = document.getElementById(`dot-${id}`);
      if (dot) dot.classList.add('visited');
    });
    if (!currentCountry) {
      availableCountries.forEach(id => {
        const dot = document.getElementById(`dot-${id}`);
        if (dot && !visitedCountries.has(id)) dot.classList.add('available');
      });
    }
  }

  function pickRandomCountries() {
    const allIds = [...countryOrder];
    const unvisited = allIds.filter(id => !visitedCountries.has(id));
    const visited = allIds.filter(id => visitedCountries.has(id));

    if (unvisited.length === 0) {
      const shuffled = [...allIds].sort(() => Math.random() - 0.5);
      return shuffled.slice(0, 3);
    }

    let result = [];
    const needNew = Math.min(2, unvisited.length);
    const shuffledUnvisited = [...unvisited].sort(() => Math.random() - 0.5);
    for (let i = 0; i < needNew; i++) result.push(shuffledUnvisited[i]);

    while (result.length < 3) {
      const remainingNew = unvisited.filter(id => !result.includes(id));
      if (remainingNew.length > 0) {
        result.push(remainingNew[0]);
      } else {
        const remainingVisited = visited.filter(id => !result.includes(id));
        if (remainingVisited.length > 0) {
          result.push(remainingVisited[Math.floor(Math.random() * remainingVisited.length)]);
        } else {
          const remainingAll = allIds.filter(id => !result.includes(id));
          if (remainingAll.length > 0) result.push(remainingAll[0]);
          else break;
        }
      }
    }
    return result.slice(0, 3).sort(() => Math.random() - 0.5);
  }

  function renderCards() {
    cardsGrid.innerHTML = '';
    if (!availableCountries || availableCountries.length === 0) {
      cardsTitle.textContent = 'No destinations available';
      noCardsMsg.classList.remove('hidden');
      noCardsMsg.textContent = 'Please reset the route to start again.';
      return;
    }
    noCardsMsg.classList.add('hidden');
    cardsTitle.textContent = 'Available destinations · choose one';

    availableCountries.forEach(id => {
      const data = countriesData[id];
      if (!data) return;
      const card = document.createElement('div');
      card.className = 'country-card';
      if (visitedCountries.has(id)) card.classList.add('visited-marker');
      card.innerHTML = `
        <h3>${data.name}</h3>
        <div class="topic-badge">${data.topic}</div>
      `;
      card.addEventListener('click', () => openCountryDialog(id));
      cardsGrid.appendChild(card);
    });
  }

  function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ---------- ДИАЛОГ ----------
  function startDialogue(countryId, playerName) {
    const data = countriesData[countryId];
    currentDialogue = {
      countryId,
      step: 0,
      playerName: playerName || 'Traveller',
      lines: [],
      answers: [],
      answered: false,
      data
    };
    renderDialogue();
  }

  function renderDialogue() {
    const d = currentDialogue;
    const data = d.data;
    const player = d.playerName;
    const friendName = data.friendName;
    const guideName = data.guideName;

    let linesHtml = '';
    d.lines.forEach((line) => {
      let speakerName;
      let cls;
      if (line.speaker === 'player') {
        speakerName = player;
        cls = 'character';
      } else if (line.speaker === 'friend') {
        speakerName = friendName;
        cls = 'friend';
      } else {
        speakerName = guideName;
        cls = 'guide';
      }
      const text = line.text.replace(/\{player\}/g, player);
      linesHtml += `<div class="dialogue-line ${cls}"><span class="speaker">${speakerName}</span>${text}</div>`;
    });

    let controlsHtml = '';

    if (d.step === 0) {
      controlsHtml = `
        <div class="name-input-row">
          <label for="playerNameInput">Your name:</label>
          <input type="text" id="playerNameInput" placeholder="e.g. Alex" value="${d.playerName !== 'Traveller' ? d.playerName : ''}" maxlength="30" />
          <button class="continue-btn" id="startNameBtn">Continue</button>
        </div>
      `;
    } else if (d.step <= data.lines.length) {
      // ещё есть реплики диалога
      controlsHtml = `<button class="continue-btn" id="continueBtn">Continue →</button>`;
    } else if (d.step === data.lines.length + 1) {
      // уведомление о тесте
      controlsHtml = `<button class="continue-btn" id="continueBtn">Continue →</button>`;
    } else {
      const qIndex = d.step - data.lines.length - 2;
      if (qIndex < data.questions.length) {
        const q = data.questions[qIndex];
        if (!d.answered) {
          const shuffled = shuffleArray(q.options);
          d.currentOptions = shuffled;
          let optHtml = '';
          shuffled.forEach((opt, i) => {
            optHtml += `<button class="option-btn" data-opt-index="${i}">${opt.text}</button>`;
          });
          controlsHtml = `
            <div class="options-list">${optHtml}</div>
            <div class="feedback" id="feedbackArea"></div>
          `;
        } else {
          const lastAnswer = d.answers[d.answers.length - 1];
          controlsHtml = `
            <div class="feedback ${lastAnswer.correct ? 'correct-feedback' : 'wrong-feedback'}">
              ${lastAnswer.correct ? '✓ Correct.' : '✗ ' + lastAnswer.explanation}
            </div>
            <button class="continue-btn" id="continueBtn">Continue →</button>
          `;
        }
      } else {
        controlsHtml = `
          <div class="feedback correct-feedback">✓ Dialogue complete! You have visited ${data.name}.</div>
          <button class="next-btn" id="nextDestBtn">Choose Next Destination</button>
        `;
      }
    }

    dialogContainer.innerHTML = `
      <div class="dialog-panel">
        <div class="country-header">
          <h2>${data.name}</h2>
          <span class="topic-tag">${data.topic} · ${data.grammar}</span>
        </div>
        <div class="dialogue-box">
          <div class="dialogue-scroll" id="dialogueScroll">
            ${linesHtml}
          </div>
          <div class="dialogue-controls">
            ${controlsHtml}
          </div>
        </div>
      </div>
    `;

    const scrollEl = document.getElementById('dialogueScroll');
    if (scrollEl) scrollEl.scrollTop = scrollEl.scrollHeight;

    if (d.step === 0) {
      const startBtn = document.getElementById('startNameBtn');
      const nameInput = document.getElementById('playerNameInput');
      if (startBtn) {
        startBtn.addEventListener('click', () => {
          const name = nameInput.value.trim() || 'Traveller';
          d.playerName = name;
          d.step = 1;
          d.lines.push(data.lines[0]);
          renderDialogue();
        });
      }
      if (nameInput) {
        nameInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') startBtn.click();
        });
        nameInput.focus();
      }
    } else if (d.step <= data.lines.length) {
      const continueBtn = document.getElementById('continueBtn');
      if (continueBtn) {
        continueBtn.addEventListener('click', () => {
          if (d.step < data.lines.length) {
            d.lines.push(data.lines[d.step]);
            d.step++;
          } else {
            // Добавляем реплику гида о тесте
            d.lines.push({ speaker: 'guide', text: "Now I’m going to conduct a test for you. Let’s see how well you’ve understood everything." });
            d.step = data.lines.length + 1;
          }
          renderDialogue();
        });
      }
    } else if (d.step === data.lines.length + 1) {
      // показываем реплику о тесте и кнопку Continue
      const continueBtn = document.getElementById('continueBtn');
      if (continueBtn) {
        continueBtn.addEventListener('click', () => {
          d.step = data.lines.length + 2;
          // Добавляем первый вопрос как реплику гида
          if (data.questions.length > 0) {
            d.lines.push({ speaker: 'guide', text: data.questions[0].friendSpeech });
          }
          renderDialogue();
        });
      }
    } else {
      const qIndex = d.step - data.lines.length - 2;
      if (qIndex < data.questions.length) {
        const q = data.questions[qIndex];
        const optionButtons = dialogContainer.querySelectorAll('.option-btn');
        optionButtons.forEach(btn => {
          btn.addEventListener('click', function() {
            if (d.answered) return;
            const optIndex = parseInt(this.dataset.optIndex, 10);
            const selected = d.currentOptions[optIndex];
            const feedbackArea = document.getElementById('feedbackArea');
            if (selected.correct) {
              d.answered = true;
              this.classList.add('correct');
              feedbackArea.textContent = '✓ Correct. Well done!';
              feedbackArea.className = 'feedback correct-feedback';
              optionButtons.forEach(b => b.disabled = true);
              d.lines.push({ speaker: 'player', text: selected.text });
              d.answers.push(selected);
              renderDialogue();
            } else {
              this.classList.add('incorrect');
              feedbackArea.textContent = '✗ ' + selected.explanation;
              feedbackArea.className = 'feedback wrong-feedback';
            }
          });
        });
        const continueBtn = document.getElementById('continueBtn');
        if (continueBtn) {
          continueBtn.addEventListener('click', () => {
            d.answered = false;
            d.step++;
            const nextQIndex = d.step - data.lines.length - 2;
            if (nextQIndex < data.questions.length) {
              d.lines.push({ speaker: 'guide', text: data.questions[nextQIndex].friendSpeech });
            }
            renderDialogue();
          });
        }
      } else {
        const nextBtn = document.getElementById('nextDestBtn');
        if (nextBtn) {
          nextBtn.addEventListener('click', () => {
            if (!visitedCountries.has(d.countryId)) {
              visitedCountries.add(d.countryId);
              dialoguesCompleted++;
              updateCounters();
            }
            updateMap();
            dialogContainer.classList.add('hidden');
            cardsContainer.classList.remove('hidden');
            currentCountry = null;
            availableCountries = pickRandomCountries();
            updateMap();
            renderCards();
          });
        }
      }
    }
  }

  function openCountryDialog(countryId) {
    if (!countriesData[countryId]) return;
    currentCountry = countryId;
    cardsContainer.classList.add('hidden');
    dialogContainer.classList.remove('hidden');
    startDialogue(countryId, '');
  }

  function resetProgress() {
    visitedCountries.clear();
    dialoguesCompleted = 0;
    currentCountry = null;
    updateCounters();

    dialogContainer.classList.add('hidden');
    cardsContainer.classList.remove('hidden');
    cardsGrid.innerHTML = '';
    dialogContainer.innerHTML = '';

    availableCountries = pickRandomCountries();
    updateMap();
    renderCards();
  }

  function init() {
    resetProgress();
    resetBtn.addEventListener('click', resetProgress);
    updateMap();
  }

  init();
</script>
</body>
</html>
